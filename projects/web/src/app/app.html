<div class="app-shell">
  <!-- Header -->
  <mat-toolbar color="primary" class="app-header">
    <button mat-icon-button (click)="toggleSidenav()" aria-label="Toggle navigation">
      <mat-icon>menu</mat-icon>
    </button>
    <mat-icon class="app-header__logo">directions_boat</mat-icon>
    <span class="app-header__title">{{ title() }}</span>
    <span class="app-header__spacer"></span>
    <a
      mat-icon-button
      href="https://material.angular.io"
      target="_blank"
      rel="noreferrer"
      aria-label="Documentation"
    >
      <mat-icon>open_in_new</mat-icon>
    </a>
  </mat-toolbar>

  <!-- Sidebar + main content -->
  <mat-sidenav-container class="app-body">
    <mat-sidenav
      class="app-sidebar"
      mode="side"
      [opened]="sidenavOpen()"
      [disableClose]="true"
    >
      <div class="app-sidebar__heading">Library Components</div>
      <mat-nav-list>
        @for (item of components(); track item.path) {
          <a
            mat-list-item
            [routerLink]="item.path"
            routerLinkActive
            #rla="routerLinkActive"
            [activated]="rla.isActive"
          >
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="app-content">
      <router-outlet />
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
